<section class="page-hero{% if hero_img %} has-img{% endif %}" {% if hero_img %}style="background-image:linear-gradient(180deg,rgba(0,0,0,.55),#000),url('{{ hero_img }}')"{% endif %}>
  <div class="container">
    <div class="crumbs"><a href="{{ url_for('home') }}">Home</a><span>/</span>{{ eyebrow or 'Page' }}</div>
    <h1 class="display heading-huge"><span class="split-line"><span>{{ heading|safe }}</span></span></h1>
    {% if sub %}<p class="lead reveal">{{ sub }}</p>{% endif %}
  </div>
</section>
